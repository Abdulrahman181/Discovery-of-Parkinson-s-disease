[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinson-image-experiment"
version = "0.2.0"
description = "Research-only tooling for group-disjoint Parkinson image experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["tensorflow>=2.16,<3"]
test = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
parkinson-experiment = "parkinson.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
